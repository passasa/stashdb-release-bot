services:
  bot:
    build: .
    container_name: stashdb-release-bot
    restart: unless-stopped
    # Configuration et secrets : uniquement dans .env, jamais dans ce fichier.
    env_file: .env
    environment:
      BOT_DATA_DIR: /data
    volumes:
      - bot-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

volumes:
  bot-data:
